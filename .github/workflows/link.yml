name: Link a post to the idea it came from

on:
  workflow_dispatch:
    inputs:
      idea_id:
        description: 'Idea number from the daily report'
        required: true
        type: string
      post_url:
        description: 'Link to your Instagram post'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: igtt-db
  cancel-in-progress: false

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Link
        env:
          IDEA_ID: ${{ inputs.idea_id }}
          POST_URL: ${{ inputs.post_url }}
        run: python link.py "$IDEA_ID" "$POST_URL"
      - name: Commit updated database
        uses: stefanzweifel/git-auto-commit-action@8621497c8c39c72f3e2a999a26b4ca1b5058a842  # v5.0.1
        with:
          commit_message: "chore: link idea ${{ inputs.idea_id }}"
          file_pattern: data/intelligence.db
