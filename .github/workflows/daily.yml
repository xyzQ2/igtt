name: Daily intelligence run

on:
  schedule:
    - cron: '0 11 * * 1,4'   # Mon + Thu 11:00 UTC (Mon runs after discover.yml); twice weekly for cost
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: igtt-db
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Daily run
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: python app.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: reports/latest.html
      - name: Commit database
        uses: stefanzweifel/git-auto-commit-action@8621497c8c39c72f3e2a999a26b4ca1b5058a842  # v5.0.1
        with:
          commit_message: "chore: daily run ${{ github.run_id }}"
          file_pattern: data/intelligence.db
