name: Weekly account discovery

on:
  # Manual only: the weekly hashtag scrape pushed Apify past its free $5/month.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: igtt-db
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Discover accounts
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python discover.py
      - name: Commit database
        uses: stefanzweifel/git-auto-commit-action@8621497c8c39c72f3e2a999a26b4ca1b5058a842  # v5.0.1
        with:
          commit_message: "chore: weekly discovery ${{ github.run_id }}"
          file_pattern: data/intelligence.db
