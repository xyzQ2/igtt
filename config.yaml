brand:
  name: Jaqueline
  instagram: jaquelinebycie
  voice: >
    Editorial female fashion model, confident and aspirational.
  # What the brand sells and who it is for. Every prompt reads these, so changing
  # them retargets discovery, analysis, pattern fit and the daily ideas.
  industry: Female fashion modeling
  target_market: >
    Women and fashion followers aged 18-35 across North and South America
    (US, Canada, Mexico, Brazil, Colombia, Argentina); English, Spanish and
    Portuguese speaking.

monitoring:
  # Where posts come from. apify: paid scraper, includes view counts.
  # meta: free via your own Meta app (Business Discovery) — Business/Creator
  # accounts only, no views for other accounts. Needs IG_ACCESS_TOKEN + IG_USER_ID.
  source: apify
  max_accounts: 75
  # Models post every few days, not daily; 7 kept 9 of 80 scraped posts.
  posts_lookback_days: 30
  # 8 keeps Apify inside its free $5/month; models post every few days.
  results_per_account: 8
  candidate_posts_for_text_ai: 40
  # 0 turns the Gemini video tier off. Set back to 15 to re-enable.
  candidate_posts_for_video_ai: 0
  daily_top_posts: 25

categories:
  - fashion
  - modeling
  - beauty
  - style
  - lifestyle
  - fitness

scoring:
  views_per_follower: 0.30
  engagement_rate: 0.25
  total_engagement: 0.20
  raw_views: 0.15
  comments: 0.10
  # Carries the ranking when views are unknown (monitoring.source: meta).
  engagement_per_follower: 0.25
  ai_weight: 0.20
  acceleration_threshold: 1.5

discovery:
  activate_above: 60
  deactivate_below: 50
  hashtags:
    - fashionmodel
    - femalemodel
    - modellife
    - editorialmodel
    - instamodel
    - latinamodel
    - modelobrasileira
    - modelocolombiana
    - modelomexicana
    - modelpolaroids

ideas:
  daily_count: 10

models:
  # anthropic | openai | google. The key goes in ANTHROPIC_API_KEY,
  # OPENAI_API_KEY or GEMINI_API_KEY. Blank models use the provider's
  # defaults in src/llm.py.
  provider: anthropic
  text_analysis:
  strategy:
  # Video analysis is Gemini-only (needs GEMINI_API_KEY) and is off above.
  video: models/gemini-2.5-flash

email:
  enabled: true  # needs SMTP_HOST/USER/PASSWORD/TO secrets; a failed send never fails the run
