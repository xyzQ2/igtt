brand:
  name: Jaqueline
  instagram: jaquelinebycie
  voice: >
    Editorial female fashion model, confident and aspirational.
  # What the brand sells and who it is for. Every prompt reads these, so changing
  # them retargets discovery, analysis, pattern fit and the daily ideas.
  industry: Female fashion modeling
  target_market: >
    Women and fashion followers aged 18-35 across North and South America
    (US, Canada, Mexico, Brazil, Colombia, Argentina); English, Spanish and
    Portuguese speaking.

monitoring:
  max_accounts: 75
  # Models post every few days, not daily; 7 kept 9 of 80 scraped posts.
  posts_lookback_days: 30
  results_per_account: 20
  candidate_posts_for_text_ai: 40
  # 0 turns the Gemini video tier off. Set back to 15 to re-enable.
  candidate_posts_for_video_ai: 0
  daily_top_posts: 25

categories:
  - fashion
  - modeling
  - beauty
  - style
  - lifestyle
  - fitness

scoring:
  views_per_follower: 0.30
  engagement_rate: 0.25
  total_engagement: 0.20
  raw_views: 0.15
  comments: 0.10
  ai_weight: 0.20
  acceleration_threshold: 1.5

discovery:
  activate_above: 60
  deactivate_below: 50
  hashtags:
    - fashionmodel
    - femalemodel
    - modellife
    - editorialmodel
    - instamodel
    - latinamodel
    - modelobrasileira
    - modelocolombiana
    - modelomexicana
    - modelpolaroids

ideas:
  daily_count: 10

posting:
  # auto is intentionally unused — nothing in the code reads this flag.
  # Unattended posting was deferred; the absence of code enforcing it is a
  # stronger guarantee than a flag check. Do not "fix" this by wiring it up
  # without a deliberate design decision to allow unattended posting.
  auto: false
  max_per_day: 1
  # A media_url without a scheme is treated as a path under this base, so a brief
  # can just say "media/reel-0912.mp4". The repo is public, which is the only
  # reason raw.githubusercontent.com works — Instagram fetches the file itself and
  # never sends credentials.
  media_base_url: https://raw.githubusercontent.com/xyzQ2/igtt/igtt-build/

models:
  text_analysis: claude-sonnet-5
  strategy: claude-opus-5
  video: models/gemini-2.5-flash

email:
  enabled: true  # needs SMTP_HOST/USER/PASSWORD/TO secrets; a failed send never fails the run
